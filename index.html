    <!-- Initial Theme Hydration (defaults to dark mode, prevents flash) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ks_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
